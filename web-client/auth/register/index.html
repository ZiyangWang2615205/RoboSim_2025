<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>User Register</title>
    <link
      href="https://fonts.googleapis.com/css?family=Oxanium"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/tailwindcss@3.3.5/src/css/preflight.css">
    <link src="../../src/styles/auth.css" />
    <script src="../../src/register.ts" defer type="module"></script>
  </head>
  <body>
      <form class="auth-form">
        <h2>RoboSim Register</h2>
        <div class="auth-section">
          <label for="username">Username: </label>
          <input
            type="text"
            id="username"
            placeholder="Enter your username "
            autocomplete="username"
            required
          />
        </div>
        <div class="auth-section">
          <label for="name">Name: </label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            autocomplete="name"
            required
          />
        </div>
        <div class="auth-section">
          <label for="password">Password: </label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="auth-section">
          <label for="password-confirm">Confirm Password: </label>
          <input
            type="password"
            id="password-confirm"
            placeholder="Re-enter your password"
            autocomplete="current-password"
            required
          />
        </div>
        <button id="register-btn">Register</button>
        <p id="popupText"></p>
        <a href="/auth/login/index.html">
          Already have an account? Login now!
        </a>
      </form>
  </body>
</html>
