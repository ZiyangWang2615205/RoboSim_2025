[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algorithm-client"
dynamic = ["version"]
description = 'Create algorithms for self-stacking boxes'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [{ name = "Ashby Thorpe", email = "ashbythorpe@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["typing-extensions", "python-dotenv", "websockets", "asyncio"]

[tool.hatch.version]
path = "src/algorithm_client/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.0.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/algorithm_client tests}"

[tool.coverage.run]
source_pkgs = ["algorithm_client", "tests"]
branch = true
parallel = true
omit = ["src/algorithm_client/__about__.py"]

[tool.coverage.paths]
algorithm_client = [
  "src/algorithm_client",
  "*/algorithm-client/src/algorithm_client",
]
tests = ["tests", "*/algorithm-client/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101"]

[tool.ruff]
extend-exclude = ["docs"]

[tool.ruff.lint]
ignore = ["S311", "PLR2004"]