name: CI/CD - Build for all branches, Deploy on dev

on:
  push:
    branches: ["**"]
    # make a limitation for PR so that UI more clearly
  pull_request:
    branches: ["**"]
  # could be triggered by hand
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/robosim-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # pull repo codes
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup BuildX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # login GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # give tag and latest tag only added in dev updates
      - name: Create tag and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      # build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 (dev only)
    runs-on: ubuntu-latest

    needs: [build-and-push]

    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="sha-${SHORT_SHA}"

          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /home/ubuntu/apps/2025-RoboSim && APP_TAG=${TAG} bash infrastructure/deploy.sh"
